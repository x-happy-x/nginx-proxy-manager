version: "1"
app: homenet

metadata:
  name: HomeNet
  version: NPM-23
  description: Р”РѕРјР°С€РЅРёР№ РїРѕСЂС‚Р°Р» Рё СѓРїСЂР°РІР»РµРЅРёРµ РїСЂРѕРєСЃРё
  icon: frontend/static/icons/server.svg
  os: linux
  arch: arm64

target:
  host: 192.168.1.1
  user: root
  port: 222
  password_env: DMS_ROUTER_PASSWORD
  remote_bin: /opt/bin/dms-service
  root: /opt/dms

build:
  - cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../bin/linux-arm64/manager ./manager
  - cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../bin/linux-arm64/nginx ./nginx
  - cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../bin/linux-arm64/homenet ./ctl
  - npm ci --prefix frontend
  - npm run build --prefix frontend

artifacts:
  - source: bin/linux-arm64/manager
    destination: /opt/etc/homenet/nginx/bin/linux-arm64/manager
    mode: 0755
  - source: bin/linux-arm64/nginx
    destination: /opt/etc/homenet/nginx/bin/linux-arm64/nginx
    mode: 0755
  - source: bin/linux-arm64/homenet
    destination: /opt/etc/homenet/nginx/bin/linux-arm64/homenet
    mode: 0755
  - source: frontend/static/react
    destination: /opt/etc/homenet/nginx/frontend/static/react
    mode: 0755
  - source: init.d/S99nginx-manager-lite
    destination: /opt/etc/homenet/nginx/init.d/S99nginx-manager-lite
    mode: 0755

service:
  init_source: /opt/etc/homenet/nginx/init.d/S99nginx-manager-lite
  init_name: S99nginx-manager-lite
  action: restart

healthcheck:
  url: http://192.168.1.1:63412/health
  attempts: 15
  interval: 1s
  status: 200
  contains: ok
