# NPM-13: prepend to the active rules, before GEOIP,RU.
# CrazyDNS cloud dialbacks TCP 8090 and agent UDP 9/4044.
# IP matching is required: router-originated dialbacks have an empty host.
rules:
  - AND,((NETWORK,TCP),(DST-PORT,8090),(IP-CIDR,5.35.2.42/32,no-resolve)),OLCRTC
  - AND,((NETWORK,TCP),(DST-PORT,8090),(IP-CIDR,31.135.14.238/32,no-resolve)),OLCRTC
  - AND,((NETWORK,TCP),(DST-PORT,8090),(IP-CIDR,87.228.71.67/32,no-resolve)),OLCRTC
  - AND,((NETWORK,TCP),(DST-PORT,8090),(IP-CIDR,95.213.212.50/32,no-resolve)),OLCRTC
  - AND,((NETWORK,TCP),(DST-PORT,8090),(IP-CIDR,178.250.154.58/32,no-resolve)),OLCRTC
  - AND,((NETWORK,TCP),(DST-PORT,8090),(IP-CIDR,185.162.93.96/32,no-resolve)),OLCRTC
  - 'AND,((NETWORK,TCP),(DST-PORT,8090),(DOMAIN-REGEX,^ndns[0-9]+\.omni\.ru$)),OLCRTC'
  - AND,((NETWORK,UDP),(DST-PORT,9/4044),(IP-CIDR,5.35.2.42/32,no-resolve)),OLCRTC
  - AND,((NETWORK,UDP),(DST-PORT,9/4044),(IP-CIDR,31.135.14.238/32,no-resolve)),OLCRTC
  - AND,((NETWORK,UDP),(DST-PORT,9/4044),(IP-CIDR,87.228.71.67/32,no-resolve)),OLCRTC
  - AND,((NETWORK,UDP),(DST-PORT,9/4044),(IP-CIDR,95.213.212.50/32,no-resolve)),OLCRTC
  - AND,((NETWORK,UDP),(DST-PORT,9/4044),(IP-CIDR,178.250.154.58/32,no-resolve)),OLCRTC
  - AND,((NETWORK,UDP),(DST-PORT,9/4044),(IP-CIDR,185.162.93.96/32,no-resolve)),OLCRTC
  - 'AND,((NETWORK,UDP),(DST-PORT,9/4044),(DOMAIN-REGEX,^ndns[0-9]+\.omni\.ru$)),OLCRTC'
