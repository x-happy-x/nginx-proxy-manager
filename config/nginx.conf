# Dedicated HomeNet process. Never include this file in Keenetic's nginx.
user nobody root;
worker_processes 1;
pid /opt/etc/homenet/proxy/nginx.pid;
lock_file /opt/etc/homenet/proxy/nginx.lock;
error_log /opt/var/log/homenet/error.log warn;
events {
  worker_connections 1024;
}
http {
  server_names_hash_bucket_size 128;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /opt/var/log/homenet/access.log;
  client_body_temp_path /opt/etc/homenet/proxy/body;
  proxy_temp_path /opt/etc/homenet/proxy/proxy-temp;
  scgi_temp_path /opt/etc/homenet/proxy/scgi-temp;
  client_max_body_size 100m;
  sendfile on;
  keepalive_timeout 30;
  server_tokens off;
  include /opt/etc/homenet/proxy/conf.d/*.conf;
  include /opt/etc/homenet/proxy/sites-enabled/*.conf;
  server {
    listen 127.0.0.1:63413;
    server_name localhost;
    access_log off;
    location = /health { return 200 'homenet-proxy-ok\n'; }
    location / { return 404; }
  }
}
