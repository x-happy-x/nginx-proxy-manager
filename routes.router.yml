schema_version: "2.1"
globals:
    ssl_mode: local-ca
    listen_ips:
        - 192.168.1.2
        - 192.168.99.2
    ports:
        http: 80
        https: 443
        http_extra: []
        https_extra: []
    ui:
        host: 192.168.1.1
        port: 63412
    stub:
        enabled: true
        root: /opt/var/www/stub
    acme:
        email: admin@crubs.store
apps:
