hosts:
    - host: ha.crubs.store
      kind: public
      app_id: ha
      verify_upstream_ssl: false
      ws_proxy:
        enabled: false
        path: /connections
        rewrite_to_wss: false
        rewrite_from: ""
      dns:
        publish:
            - local
        local_record_ip: auto
      tls:
        cert_policy: auto_local_ca
        cert_ref: auto
        san: []
      endpoints:
        - name: web
          listen:
            protocol: https
            port: 443
          behavior:
            redirect: https
            ndns_profile: ""
            ndns_name: ""
            ndns_domain: ndns
            ndns_security_level: public
            ndns_ssl_redirect: true
